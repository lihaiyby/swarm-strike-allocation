# 我方无人机参数
# 注：【批注 B4】要求不一致处以 方案04-Long-修改.docx 为准，故 speed_mps 由 50-60 改为 30-60。
count_ratio: 3            # 总数 = 3n（数量充足）
speed_mps: [30, 60]       # 【批注 B4】Long 版：30-60 m/s（原 v3 为 50-60）
unit_value: 1             # 单机价值（与敌方统一价值标准）
max_range_m: R            # 最大航程 = 战场半径
suicide: true             # 自杀式：单次打击后退出；已下达指令即冻结
deploy: uniform_inner     # 初始位置：内球面（防线 700m）均匀随机
