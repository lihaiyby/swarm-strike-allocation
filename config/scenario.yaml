# 战场与场景生成参数（方案04-v3，2026-09-06 评审确认）
battlefield:
  R_choices_m: [3000, 4000, 5000]   # 战场半径，50 个场景三档均匀轮换
  defense_radius_m: 700             # 基地防线（内球面）半径
  enemy_max_speed_mps: 50           # 战局总时长 T = R / 50 s
  hemisphere: true                  # 半球形战场（上半球）

waves:
  count: 3
  times_frac: [0.0, 0.333333, 0.666667]  # 0, T/3, 2T/3
  groups_per_wave: 6                # 每波 6 群、随机方向
  split: equal                      # 三波均分总敌机数

enemy_count:
  n_min: 100                        # 每个场景 n 随机取 100~150
  n_max: 150

cluster:
  sigma_m: [150, 250]               # 高斯团扩散半径（团内间距百米级）
  size_jitter: 0.2                  # 每群数量 = 该波/6 ±20% 随机扰动
  min_center_sep_sigma: 4.0         # 团心两两间距 ≥ 4σ
  noise_ratio: 0.05                 # 散点（噪点）占该波总数 5%，独立成群

seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
        1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
        1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029,
        1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039,
        1040, 1041, 1042, 1043, 1044, 1045, 1046, 1047, 1048, 1049]

perception:
  eps_m: 550          # k-distance 图标定（results/eps_calibration.png，拐点中位数 553m）
  min_samples: 3
