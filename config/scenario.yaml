# 战场与场景生成参数（方案04-v3，2026-09-06 评审确认）
battlefield:
  R_choices_m: [3000, 4000, 5000]   # 战场半径，50 个场景三档均匀轮换
  defense_radius_m: 700             # 基地防线（内球面）半径
  enemy_max_speed_mps: 50           # 战局总时长 T = R / 50 s
  hemisphere: true                  # 半球形战场（上半球）

waves:
  count: 3
  times_frac: [0.0, 0.333333, 0.666667]  # 0, T/3, 2T/3
  groups_per_wave: 6                # 每波 6 群、随机方向
  split: equal                      # 三波均分总敌机数

enemy_count:
  n_min: 100                        # 每个场景 n 随机取 100~150
  n_max: 150

cluster:
  sigma_m: [150, 250]               # 高斯团扩散半径（团内间距百米级）
  size_jitter: 0.2                  # 每群数量 = 该波/6 ±20% 随机扰动
  min_center_sep_sigma: 4.0         # 团心两两间距 ≥ 4σ
  noise_ratio: 0.05                 # 散点（噪点）占该波总数 5%，独立成群

seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
        1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
        1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029,
        1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039,
        1040, 1041, 1042, 1043, 1044, 1045, 1046, 1047, 1048, 1049]

perception:
  eps_m: 550          # k-distance 图标定（results/eps_calibration.png，拐点中位数 553m）
  min_samples: 3
  # 【V2-P6】威胁评估特征（老师建议第 8 条：要综合考虑价值、速度、**速度方向**）
  #   value   群总价值 Σv                        （越大越威胁）
  #   speed   群平均速度                          （越大越威胁）
  #   dist    群到基地最近距离                    （越小越威胁）
  #   closure **平均径向接近速率**（含方向）      （越大越威胁）
  #   eta     **最早突防剩余时间**（含方向+位置） （越小越威胁）
  # 熵权法会自动把"无区分度"的特征降权，所以多放几个不会破坏结果。
  # 旧口径为 [value, speed, dist]；改用 [value, closure, eta] 即"综合考虑速度与方向"。
  threat:
    features: [value, closure, eta]
    defense_radius_m: 700   # 仅 eta 使用（也可省略，缺省读 battlefield）
    # 【V2-P6】紧迫性加权系数 β：算法看到的目标价值 = v·(1 + β·urgency)
    #   urgency 由"径向接近速率"在当前目标间归一化得到（含速度方向）。
    #   0 = 关闭（默认，结果与旧版一致）；实测 β=0.6 对部分算法有效（见进度记录）。
    urgency_beta: 0.0

# 编制档位（P2.1，2026-10-29 决策 D1 = 保守方案）
# 我方兵力 = ratio × n。3.0 为原方案（easy，默认、向后兼容）；
# 2.5 消除"随机≈贪心"病态（差距 0.5%→8.7%），2.0 出现冠军翻转。
# 依据见 docs/擂台改造-进度记录.md 2026-10-29 18:05（exp5 反事实实验）。
# 注意：这里只定义档位，**不改** friendly.count_ratio —— 不指定档位时行为与以前完全一致。
#
# 【V2-P5】2026-11-27 老师决定：**保留原有三档，另加 4.0n 与 3.5n 两档**。
#   动机：时序口径下兵力是突防率的主杠杆（实测 2.5n→4.0n：突防率 38.8%→10.3%），
#   需要一个"容量充足"的参照档，用于区分"算法差异"与"资源不足"。
#   命名沿用 ratio 语义：r35 = 3.5n、r40 = 4.0n。
tiers:
  r40: 4.0
  r35: 3.5
  easy: 3.0
  normal: 2.5
  hard: 2.0
tier_default: easy   # data/scenes.pkl 对应 easy；其余档写入 data/scenes_<tier>.pkl
