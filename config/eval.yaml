# 统一评估参数
kill_threshold: 0.9       # 歼灭判定：累积毁伤概率 ≥ 0.9 视为歼灭
quota:
  p_table: { "0.4": 5, "0.7": 2, "0.9": 1 }   # 达到 0.9 所需架数（校验用）
time_limit_s: 1.0         # 单次分配求解耗时上限（超出进入惩罚函数）

# 【批注 B4】资源不足时的优先顺序，按 方案04-Long-修改.docx：
#   "资源池不足时优先分配资源给高价值敌方机组"
#   value  = 按【群总价值】从高到低（Long 版口径，默认）
#   threat = 按【熵权 TOPSIS 威胁度】从高到低（旧口径，保留用于对照）
# 注意：高价值 ≠ 高威胁——威胁度还含速度与距离，两套排序可能给出不同结果。
select_priority: value

# 【批注 B3】我方分组 + 组对组对抗（强制 C3）
# mode: even（按敌群数量均分）/ sector（按空间方位分扇区）/ nearest（就近组队）
# 启用后框架会在 algo.solve 之后做"投影 + C2 修复"，保证任何算法都得到 C3 可行解。
grouping:
  enabled: false
  mode: even

# 距离代价项（【批注 B1】形式 C）：目标函数加 −c·d_ij，不改毁伤，只影响"值不值得"
# 结果记为 a_net = a_gain − c · Σ d_ij x_ij
distance_cost:
  enabled: false
  c: 0.0001             # 每米代价（价值单位）；整场 Σd≈1.1e6 m 时折合约 110 价值

# 【批注 B1】形式 D：时间延迟。命中时刻 = 发射时刻 + d_ij / speed_mps
# 注意：当前我方速度 30~60 m/s、交战距离 2300~5700 m → 飞行 38~190 s，
#      而战局总时长 T=60~100 s，直接开启会让绝大多数打击落在战局结束之后。
#      因此 speed_mps 需按场景重新标定（实验中会做速度扫描）。
time_delay:
  enabled: false
  speed_mps: 300.0

# 总评分权重（决策 D3，2026-11-02 拍板）
# 主得分项 = a_kill「歼灭价值」= Σ v_j · [P_j ≥ kill_threshold]，即**敌方被击毁无人机的价值总和**。
#   它与模型目标 a_gain = Σ v_j·P_j 不同：a_gain 按概率加权，被击毁的目标只计 0.9~1.0 倍价值；
#   a_kill 按面值计，只统计真正被歼灭的目标，不计幸存者的部分毁伤。
# 权重合计为 1；c（稳定性）不进入加权和，改由方案 C 的 mean−λ·std 承担。
weights:
  a_kill: 0.60            # 主得分：敌方被歼灭的价值
  b_threat: 0.20          # 威胁消除率（编队是否被全歼）
  d_cost: 0.15            # 效费比
  time_s: 0.05            # 求解效率

penalty:
  over_force_per_unit: null   # 超兵力惩罚系数【待定】
  overtime_per_s: null        # 超时惩罚系数【待定】

monte_carlo: false        # 主评估用期望值口径；true 为掷骰子口径（附录用）

# 距离衰减的毁伤概率（决策 D6，2026-11-02 新增）
# p_ij = p_j · exp(-λ · d_ij / ref_range_m)
# enabled: false 时与旧版**逐位一致**（p_ij 退化为 p_j）。
# 开启后"哪架机打哪个目标"第一次影响结果，用于打破"单轮分配可精确求解"造成的算法同质化。
range_decay:
  enabled: true
  lambda: 2.0             # 越大衰减越强
  ref_range_m: 3000.0     # 绝对口径的参考距离（仅在 pair_p 中使用，仿真走相对口径）
  # D6b 硬射程：δ_ij > hard_frac 的机**不可达**（p_ij = 0）。
  # 0 = 关闭；0.5 表示"只有距离在前一半的我机可达"。
  # 与 lambda 配合使用：lambda 控制"打得多弱"，hard_frac 控制"能不能打"。
  hard_frac: 0.0
